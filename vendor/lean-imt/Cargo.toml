[package]
name = "lean-imt"
version = "0.1.2"
authors = ["Hamza Khalid"]
edition = "2021"
license = "MIT"
description = "A lightweight incremental Merkle tree library."
documentation = "https://docs.rs/lean-imt"
repository = "https://github.com/hmzakhalid/lean-imt"
homepage = "https://github.com/hmzakhalid/lean-imt"
keywords = ["merkle", "tree", "incremental", "cryptography"]
categories = ["cryptography", "data-structures"]
readme = "README.md"

[dependencies]
hashbrown = "0.15.2"
poseidon-ark-vendored = { path = "../poseidon-ark" }
pinocchio = "0.9"
pinocchio-log = "0.5"

[features]
default = ["std"]
std = []
