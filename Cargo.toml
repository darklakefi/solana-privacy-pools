[package]
name = "solana-privacy-pools"
version = "0.1.0"
edition = "2021"

[dependencies]
pinocchio = "0.9"
pinocchio-token = "0.4"
pinocchio-log = "0.5"
groth16-solana = { path = "vendor/groth16-solana", features = ["debug-groth16"] }
lean-imt = { path = "vendor/lean-imt", default-features = false }
poseidon-ark = { path = "../poseidon-ark" }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
ark-ff = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false }

[lib]
crate-type = ["cdylib", "lib"]

[features]
test-utils = []
test-precomputed-hashes = []
custom-heap = []
custom-panic = []

[dev-dependencies]
# Keep minimal for now

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1